name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare secret signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "::error::Missing secrets: KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" -alias "$KS_ALIAS" > "$RUNNER_TEMP/ks.txt" || { echo "::error::Cannot open keystore (wrong base64, password or alias)"; exit 1; }
          echo "== Signing fingerprints (public info, add SHA1 to Firebase) =="
          grep -E "SHA1:|SHA256:" "$RUNNER_TEMP/ks.txt"
          SHA=$(grep -m1 "SHA256:" "$RUNNER_TEMP/ks.txt" | sed 's/.*SHA256: *//' | tr -d ': ' | tr 'A-F' 'a-f')
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "CERT_SHA256=$SHA" >> "$GITHUB_ENV"

      - name: Prepare project files
        run: |
          mkdir -p www assets
          cp index.html offline.html www/
          cp icon-only.png splash.png splash-dark.png assets/
          npm install --legacy-peer-deps

      - name: Create Android project
        run: npx cap add android

      - name: Generate icons and splash (optional)
        continue-on-error: true
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/assets
          npx capacitor-assets generate --android

      - name: Add native code and patch Android project
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          D=android/app/src/main/java/com/sami/tvlivevip
          mkdir -p $D
          cp MainActivity.java KeepAliveService.java $D/
          python3 patch_android.py
          npx cap sync android

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TV-LIVE-VIP.apk

      - name: Verify APK is signed with the secret key
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $AS verify --print-certs TV-LIVE-VIP.apk | grep -E "SHA-1|SHA-256"
          GOT=$($AS verify --print-certs TV-LIVE-VIP.apk | grep -m1 "certificate SHA-256" | sed 's/.*: *//' | tr -d ': ' | tr 'A-F' 'a-f')
          echo "built=$GOT"
          echo "expected=$CERT_SHA256"
          if [ "$GOT" != "$CERT_SHA256" ]; then echo "::error::APK signature does not match the secret key"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: TV-LIVE-VIP-apk
          path: TV-LIVE-VIP.apk

      - name: Publish release (used by in-app update check)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TV LIVE VIP build ${{ github.run_number }}
          files: TV-LIVE-VIP.apk
          make_latest: true
