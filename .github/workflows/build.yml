name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare project files
        run: |
          mkdir -p www assets
          cp index.html offline.html www/
          cp icon-only.png splash.png splash-dark.png assets/
          npm install --legacy-peer-deps

      - name: Create Android project
        run: npx cap add android

      - name: Generate icons and splash (optional)
        continue-on-error: true
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/assets
          npx capacitor-assets generate --android

      - name: Add native code and patch Android project
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          D=android/app/src/main/java/com/sami/tvlivevip
          mkdir -p $D
          cp MainActivity.java KeepAliveService.java $D/
          python3 patch_android.py
          npx cap sync android

      - name: Show signing fingerprint
        run: keytool -list -v -keystore debug.keystore -storepass android | grep -E "SHA1|SHA256"

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TV-LIVE-VIP.apk

      - name: Show APK signing certificate
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $AS verify --print-certs TV-LIVE-VIP.apk | grep -E "SHA-1|SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: TV-LIVE-VIP-apk
          path: TV-LIVE-VIP.apk

      - name: Publish release (used by in-app update check)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TV LIVE VIP build ${{ github.run_number }}
          files: TV-LIVE-VIP.apk
          make_latest: true
