name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare project files
        run: |
          mkdir -p www assets
          cp index.html offline.html www/
          cp icon-only.png splash.png splash-dark.png assets/
          npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate icons and splash (optional)
        continue-on-error: true
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android

      - name: Install custom fullscreen player support
        run: |
          mkdir -p android/app/src/main/java/com/sami/tvlivevip
          cp MainActivity.java android/app/src/main/java/com/sami/tvlivevip/MainActivity.java
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TV-LIVE-VIP-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
